<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#8A2BE2" />

    <!-- Modo Noche · Anti-FOUC ──────────────────────────────────────────────
         Fija data-theme en <html> ANTES de cargar React/CSS para que la página
         pinte directamente en el tema correcto (sin parpadeo claro->oscuro).
         Lee la elección guardada (localStorage "wala-theme"); si es "system" o
         no existe, usa prefers-color-scheme. DEBE coincidir con ThemeContext. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('wala-theme'); // "light" | "dark" | "system" | null
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = (saved === 'light' || saved === 'dark')
            ? saved
            : (prefersDark ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
    <meta name="description" content="Walá - Tienda de prendas personalizadas. Personaliza y compra tus prendas favoritas." />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" href="/logo-wala.png" />
    <link rel="apple-touch-icon" href="/logo-wala.png" />

    <!-- Preconnect crítico: fuentes UI y Firebase -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://firebasestorage.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://res.cloudinary.com" crossorigin />

    <!-- DNS prefetch adicional -->
    <link rel="dns-prefetch" href="https://i.ibb.co" />
    <link rel="dns-prefetch" href="https://drive.google.com" />
    <link rel="dns-prefetch" href="https://identitytoolkit.googleapis.com" />

    <!-- Tipografías locales (editor): carga diferida para no bloquear UI -->
    <link href="/fonts/fonts.css" rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript><link href="/fonts/fonts.css" rel="stylesheet" /></noscript>

    <!-- Poppins (UI principal) — carga prioritaria, solo los pesos necesarios -->
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Fuentes del editor — carga DIFERIDA (no bloquean el render inicial) -->
    <link
      id="editor-fonts-1"
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Lato:ital,wght@0,400;0,700;1,400;1,700&family=Merriweather:ital,wght@0,400;0,700;1,400;1,700&family=Montserrat:ital,wght@0,400;0,600;0,700;1,400;1,700&family=Open+Sans:ital,wght@0,400;0,600;0,700;1,400;1,700&family=Oswald:wght@400;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,700&family=Roboto:ital,wght@0,400;0,700;1,400;1,700&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400;1,700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <link
      id="editor-fonts-2"
      href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:ital,wght@0,400;0,600;0,700;1,400;1,700&family=DM+Sans:ital,wght@0,400;0,700;1,400;1,700&family=Dancing+Script:wght@400;700&family=Fira+Sans:ital,wght@0,400;0,700;1,400;1,700&family=Great+Vibes&family=Inter:ital,wght@0,400;0,700;1,400;1,700&family=Kanit:ital,wght@0,400;0,700;1,400;1,700&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Lobster&family=Nunito:ital,wght@0,400;0,700;1,400;1,700&family=Noto+Sans:ital,wght@0,400;0,700;1,400;1,700&family=Pacifico&family=Permanent+Marker&family=PT+Sans:ital,wght@0,400;0,700;1,400;1,700&family=Quicksand:wght@400;600;700&family=Raleway:ital,wght@0,400;0,700;1,400;1,700&family=Righteous&family=Rubik:ital,wght@0,400;0,700;1,400;1,700&family=Ubuntu:ital,wght@0,400;0,700;1,400;1,700&family=Work+Sans:ital,wght@0,400;0,600;0,700;1,400;1,700&family=Caveat:wght@400;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet" />
    </noscript>

    <title>Walá - Tienda Personalizada</title>
  </head>
  <body>
    <noscript>Necesitas habilitar JavaScript para ejecutar esta aplicación.</noscript>
    <div id="root">
      <!-- Pantalla de carga mientras React carga — mismo diseño que BrandLoader.jsx
           (icono + halo + wordmark "WALA" + barra de progreso indeterminada,
           sobre el mismo degradado de marca con un par de glows suaves), asi
           que cuando React monta y toma el relevo con su propio BrandLoader, la
           transicion es invisible en vez de un salto de un layout a otro.
           Inline (sin CSS module: esto pinta ANTES de que cargue ningun bundle). -->
      <div id="app-loading" style="position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:radial-gradient(60% 55% at 18% 12%,rgba(255,255,255,.16) 0%,rgba(255,255,255,0) 60%),radial-gradient(55% 50% at 88% 92%,rgba(76,29,149,.35) 0%,rgba(76,29,149,0) 60%),linear-gradient(135deg,#8B5CF6 0%,#5B21B6 100%);">
        <div style="display:flex;flex-direction:column;align-items:center;gap:18px;">
          <div style="position:relative;width:148px;height:148px;display:flex;align-items:center;justify-content:center;">
            <span id="app-loading-halo-wide" style="position:absolute;inset:-28%;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.14) 0%,rgba(255,255,255,0) 68%);"></span>
            <span id="app-loading-halo" style="position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.3) 0%,rgba(255,255,255,0) 70%);"></span>
            <svg viewBox="12 0 94 109" width="96" style="position:relative;transform-origin:center;animation:appLoadingClick 2.2s infinite;filter:drop-shadow(0 5px 14px rgba(76,29,149,.28));" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <defs>
                <linearGradient id="walaSplashGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#8B5CF6" />
                  <stop offset="100%" stop-color="#5B21B6" />
                </linearGradient>
              </defs>
              <path d="M 32 42 L 28 88 C 27 92 30 94 34 93 L 85 80 C 89 79 91 76 89 72 L 76 18 C 75 13 68 11 65 14 L 36 34 C 32 37 31 40 32 42 Z" fill="#FFFFFF" />
              <circle cx="67" cy="23" r="6.5" fill="#8B5CF6" />
              <path d="M 38 42 L 43 78 L 54 52 L 64 72 L 72 38" fill="none" stroke="url(#walaSplashGrad)" stroke-width="15" stroke-linecap="round" stroke-linejoin="round" transform="translate(55 58) scale(0.8) translate(-55 -58)" />
            </svg>
          </div>
          <span style="font-family:'Poppins','Montserrat',system-ui,sans-serif;font-weight:700;font-size:1.2rem;letter-spacing:.16em;color:#fff;text-transform:uppercase;text-shadow:0 2px 12px rgba(76,29,149,.35);">Walá</span>
          <div style="position:relative;width:132px;height:4px;border-radius:999px;overflow:hidden;background:rgba(255,255,255,.22);">
            <span id="app-loading-bar" style="position:absolute;inset:0;width:36%;border-radius:inherit;background:linear-gradient(90deg,rgba(255,255,255,0) 0%,rgba(255,255,255,.95) 50%,rgba(255,255,255,0) 100%);box-shadow:0 0 12px rgba(255,255,255,.55);animation:appLoadingSweep 1.4s ease-in-out infinite;"></span>
          </div>
        </div>
      </div>
      <style>
        /* Click tipo boton: press (encoge + baja), rebote con overshoot
           (impulso) y vuelta exacta, luego una pausa hasta cerrar el ciclo
           de 1.3s. Solo el icono se mueve; los halos son estaticos. Mismo
           gesto que el BrandLoader de React para que el relevo sea invisible. */
        @keyframes appLoadingClick {
          0%   { transform: scale(1) translateY(0);           animation-timing-function: ease-out; }
          14%  { transform: scale(0.93) translateY(5px);       animation-timing-function: ease-out; }
          31%  { transform: scale(1.02) translateY(-1.5px);    animation-timing-function: ease-in-out; }
          50%  { transform: scale(1) translateY(0);            animation-timing-function: linear; }
          100% { transform: scale(1) translateY(0); }
        }
        @keyframes appLoadingSweep {
          0% { transform: translateX(-140%); }
          100% { transform: translateX(340%); }
        }
        @media (prefers-reduced-motion: reduce) {
          #app-loading svg, #app-loading-bar { animation: none !important; }
          #app-loading-bar { width: 45%; opacity: .8; }
        }
      </style>
    </div>
    <script type="module" src="/src/index.jsx"></script>
  </body>
</html>
