<!DOCTYPE html>
<html lang="es">
  <head>
    <!-- Meta Pixel -->
    <script>
      !function(f,b,e,v,n,t,s)
      {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
      n.callMethod.apply(n,arguments):n.queue.push(arguments)};
      if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
      n.queue=[];t=b.createElement(e);t.async=!0;
      t.src=v;s=b.getElementsByTagName(e)[0];
      s.parentNode.insertBefore(t,s)}(window,document,'script',
      'https://connect.facebook.net/en_US/fbevents.js');
      fbq('init', '1696511731424872');
      fbq('track', 'PageView');

    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#8A2BE2" />

    <!-- Modo Noche · Anti-FOUC ──────────────────────────────────────────────
         Fija data-theme en <html> ANTES de cargar React/CSS para que la página
         pinte directamente en el tema correcto (sin parpadeo claro->oscuro).
         Lee la elección guardada (localStorage "wala-theme"); si es "system" o
         no existe, usa prefers-color-scheme. DEBE coincidir con ThemeContext. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('wala-theme'); // "light" | "dark" | "system" | null
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = (saved === 'light' || saved === 'dark')
            ? saved
            : (prefersDark ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
    <meta name="description" content="Walá - Tienda de prendas personalizadas. Personaliza y compra tus prendas favoritas." />
    <link rel="manifest" href="/manifest.json" />
    <!-- Icono de la PESTAÑA: círculo violeta con solo la etiqueta (sin "WALÁ":
         el nombre ya lo dice la pestaña y a 16-32 px el texto emborronaba el
         icono). .ico con 16/32/48 para cualquier navegador + PNG de 32 y 192.
         La pantalla de inicio del celular (apple-touch-icon) sigue con el logo
         completo, que a ese tamaño sí se lee. -->
    <link rel="icon" href="/favicon.ico?v=2" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/pestana/favicon-32.png?v=2" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/pestana/favicon-192.png?v=2" />
    <link rel="apple-touch-icon" href="/logo-wala-192.png" />

    <!-- Preconnect crítico: fuentes UI y Firebase -->
    <!-- Logo del header (máscara de 10 KB): se pide ya, no cuando cargue el CSS. -->
    <!-- crossorigin: el navegador pide las imágenes de mask-image en modo CORS;
         sin él la precarga no se reutiliza y se descargaría dos veces. -->
    <link rel="preload" as="image" type="image/webp" href="/assets/marca/logo-header-v2.webp" crossorigin="anonymous" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://firebasestorage.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://res.cloudinary.com" crossorigin />

    <!-- DNS prefetch adicional -->
    <link rel="dns-prefetch" href="https://i.ibb.co" />
    <link rel="dns-prefetch" href="https://drive.google.com" />
    <link rel="dns-prefetch" href="https://identitytoolkit.googleapis.com" />

<!-- Poppins (UI principal) — carga prioritaria, solo los pesos necesarios -->
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Montserrat:wght@900&family=Inter:wght@400;600;700&display=swap"
      rel="stylesheet"
    />

    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Montserrat:wght@900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
    </noscript>

    <title>Walá - Tienda Personalizada</title>
  </head>
  <body>
    <noscript><img height="1" width="1" style="display:none" alt=""
      src="https://www.facebook.com/tr?id=1696511731424872&amp;ev=PageView&amp;noscript=1"
    /></noscript>
    <noscript>Necesitas habilitar JavaScript para ejecutar esta aplicación.</noscript>
    <div id="root">
      <!-- Pantalla de carga mientras React carga — mismo diseño que BrandLoader.jsx
           (etiqueta y "WALÁ" del logo oficial + halo + barra de progreso indeterminada,
           sobre el mismo degradado de marca con un par de glows suaves), asi
           que cuando React monta y toma el relevo con su propio BrandLoader, la
           transicion es invisible en vez de un salto de un layout a otro.
           Inline (sin CSS module: esto pinta ANTES de que cargue ningun bundle). -->
      <div id="app-loading" style="position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:radial-gradient(60% 55% at 18% 12%,rgba(255,255,255,.16) 0%,rgba(255,255,255,0) 60%),radial-gradient(55% 50% at 88% 92%,rgba(76,29,149,.35) 0%,rgba(76,29,149,0) 60%),linear-gradient(135deg,#8B5CF6 0%,#5B21B6 100%);">
        <div style="display:flex;flex-direction:column;align-items:center;gap:18px;">
          <div style="position:relative;width:148px;height:148px;display:flex;align-items:center;justify-content:center;">
            <span id="app-loading-halo-wide" style="position:absolute;inset:-28%;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.14) 0%,rgba(255,255,255,0) 68%);transform-origin:center;animation:appLoadingHaloWide 3.2s ease-in-out infinite;"></span>
            <span id="app-loading-halo" style="position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.3) 0%,rgba(255,255,255,0) 70%);transform-origin:center;animation:appLoadingHalo 3.2s ease-in-out infinite;"></span>
            <img id="app-loading-mark" src="/assets/marca/splash-etiqueta.webp" width="88" height="118" alt="" aria-hidden="true" draggable="false" style="position:relative;width:88px;height:auto;transform-origin:center;animation:appLoadingBreathe 3.2s ease-in-out infinite;filter:drop-shadow(0 5px 14px rgba(76,29,149,.28));" />
          </div>
          <img src="/assets/marca/splash-wala.webp" width="122" height="53" alt="Walá" draggable="false" style="display:block;width:122px;height:auto;filter:drop-shadow(0 2px 10px rgba(76,29,149,.35));" />
          <div style="position:relative;width:132px;height:4px;border-radius:999px;overflow:hidden;background:rgba(255,255,255,.22);">
            <span id="app-loading-bar" style="position:absolute;inset:0;width:36%;border-radius:inherit;background:linear-gradient(90deg,rgba(255,255,255,0) 0%,rgba(255,255,255,.95) 50%,rgba(255,255,255,0) 100%);box-shadow:0 0 12px rgba(255,255,255,.55);animation:appLoadingSweep 1.4s ease-in-out infinite;"></span>
          </div>
        </div>
      </div>
      <style>
        /* Respiracion: el icono flota (sube ~6px + escala 1.05) en un ciclo
           continuo y calmado de 3.2s, y los dos halos PULSAN en sincronia
           (mas brillo + algo mas grandes en el mismo 50%). Mismo gesto y
           mismos numeros que el BrandLoader de React (BREATHE_TRANSITION)
           para que el relevo splash->React sea invisible. */
        @keyframes appLoadingBreathe {
          0%, 100% { transform: scale(1) translateY(0); }
          50%      { transform: scale(1.05) translateY(-6px); }
        }
        @keyframes appLoadingHalo {
          0%, 100% { opacity: .8; transform: scale(1); }
          50%      { opacity: 1;  transform: scale(1.12); }
        }
        @keyframes appLoadingHaloWide {
          0%, 100% { opacity: .7; transform: scale(1); }
          50%      { opacity: 1;  transform: scale(1.1); }
        }
        @keyframes appLoadingSweep {
          0% { transform: translateX(-140%); }
          100% { transform: translateX(340%); }
        }
        /* Círculo simple para las cargas POSTERIORES a la primera (ver el
           script de abajo): el splash de marca de Walá solo se muestra la
           primera vez; después este spinner reemplaza su contenido, igual que
           el <Loading> de React que toma el relevo. */
        .app-loading-circle {
          width: 40px; height: 40px; border-radius: 50%;
          border: 3px solid #e5e7eb; border-top-color: #7C3AED;
          border-right-color: transparent;
          animation: appLoadingSpin .8s linear infinite;
        }
        @keyframes appLoadingSpin { to { transform: rotate(360deg); } }
        @media (prefers-reduced-motion: reduce) {
          .app-loading-circle { animation: none !important; }
        }
        @media (prefers-reduced-motion: reduce) {
          #app-loading-mark, #app-loading-bar,
          #app-loading-halo, #app-loading-halo-wide { animation: none !important; }
          #app-loading-bar { width: 45%; opacity: .8; }
        }
      </style>
      <script>
        /* Si el splash de marca de Walá ya se mostró alguna vez (flag que pone
           BrandLoaderOverlay tras la primera carga), en las recargas siguientes
           NO repetimos la marca: se reemplaza el contenido del splash por un
           círculo simple sobre fondo claro, en sintonía con el <Loading> que
           React monta enseguida. Corre inline, antes de cualquier bundle. */
        (function () {
          try {
            if (localStorage.getItem('wala_brand_seen') === '1') {
              var el = document.getElementById('app-loading');
              if (el) {
                el.style.background = '#f8f9fa';
                el.innerHTML = '<div class="app-loading-circle"></div>';
              }
            }
          } catch (e) { /* localStorage no disponible: se deja el splash de marca */ }
        })();
      </script>
    </div>
    <script type="module" src="/src/index.jsx"></script>
  </body>
</html>
