<!DOCTYPE html>
<html lang="es">
  <head>
    <!-- Meta Pixel -->
    <script>
      !function(f,b,e,v,n,t,s)
      {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
      n.callMethod.apply(n,arguments):n.queue.push(arguments)};
      if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
      n.queue=[];t=b.createElement(e);t.async=!0;
      t.src=v;s=b.getElementsByTagName(e)[0];
      s.parentNode.insertBefore(t,s)}(window,document,'script',
      'https://connect.facebook.net/en_US/fbevents.js');
      fbq('init', '1696511731424872');
      fbq('track', 'PageView');

    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#8A2BE2" />

    <!-- Modo Noche · Anti-FOUC ──────────────────────────────────────────────
         Fija data-theme en <html> ANTES de cargar React/CSS para que la página
         pinte directamente en el tema correcto (sin parpadeo claro->oscuro).
         Lee la elección guardada (localStorage "wala-theme"); si es "system" o
         no existe, usa prefers-color-scheme. DEBE coincidir con ThemeContext. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('wala-theme'); // "light" | "dark" | "system" | null
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = (saved === 'light' || saved === 'dark')
            ? saved
            : (prefersDark ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
    <meta name="description" content="Ropa personalizada para expresar quién eres. Descubre, elige y dale tu toque." />
    <link rel="manifest" href="/manifest.json" />
    <!-- Icono de la PESTAÑA: círculo con el degradado del kit y solo la etiqueta
         (sin "WALÁ": el nombre ya lo dice la pestaña y a 16-32 px el texto
         emborronaba el icono). .ico con 16/32/48 para cualquier navegador + PNG
         de 32 y 192. La pantalla de inicio del iPhone (apple-touch-icon) lleva el
         mismo ícono de la app de Android: cuadrado lleno, iOS le pone las esquinas. -->
    <link rel="icon" href="/favicon.ico?v=3" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/pestana/favicon-32.png?v=3" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/pestana/favicon-192.png?v=3" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=3" />

    <!-- Preconnect crítico: fuentes UI y Firebase -->
    <!-- Logo del header (máscara de 10 KB): se pide ya, no cuando cargue el CSS. -->
    <!-- crossorigin: el navegador pide las imágenes de mask-image en modo CORS;
         sin él la precarga no se reutiliza y se descargaría dos veces. -->
    <link rel="preload" as="image" type="image/webp" href="/assets/marca/logo-header-v2.webp" crossorigin="anonymous" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://firebasestorage.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://res.cloudinary.com" crossorigin />

    <!-- DNS prefetch adicional -->
    <link rel="dns-prefetch" href="https://i.ibb.co" />
    <link rel="dns-prefetch" href="https://drive.google.com" />
    <link rel="dns-prefetch" href="https://identitytoolkit.googleapis.com" />

<!-- Poppins (UI principal) — carga prioritaria, solo los pesos necesarios -->
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Montserrat:wght@900&family=Inter:wght@400;600;700&display=swap"
      rel="stylesheet"
    />

    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Montserrat:wght@900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
    </noscript>

    <title>Walá | Encuentra tu estilo</title>
  </head>
  <body>
    <noscript><img height="1" width="1" style="display:none" alt=""
      src="https://www.facebook.com/tr?id=1696511731424872&amp;ev=PageView&amp;noscript=1"
    /></noscript>
    <noscript>Necesitas habilitar JavaScript para ejecutar esta aplicación.</noscript>
    <script>
      /* Vista previa del mapa de calor (página dentro de un iframe del panel):
         se guardan los errores del ARRANQUE para que el panel pueda decir por
         qué no cargó (HeatmapViewer los lee). Fuera de un iframe no hace nada. */
      (function () {
        if (window.self === window.top) return;
        var lista = (window.__erroresArranque = []);
        var anotar = function (texto) { if (lista.length < 10) lista.push(String(texto).slice(0, 300)); };
        window.addEventListener('error', function (e) {
          anotar(e.message || (e.target && (e.target.src || e.target.href)) || 'error');
        }, true);
        window.addEventListener('unhandledrejection', function (e) {
          var r = e.reason;
          anotar((r && (r.message || r.code)) || r || 'promesa rechazada');
        });
      })();
    </script>
    <div id="root">
      <!-- Pantalla de carga mientras React carga: la misma que PantallaCarga del
           kit (componentes/kit/Cargando.jsx): el degradado plano de la marca, la
           etiqueta del logo colgada de su cordón que se mece (2,4 s, ±6°, origen
           75% 4%), WALÁ y una barra que va y viene. Mismas medidas y tiempos:
           cuando React toma el relevo con PantallaCarga, no se nota el cambio.
           Inline (sin CSS module: esto pinta ANTES de que cargue ningún bundle). -->
      <div id="app-loading" style="position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#8B5CF6 0%,#5B21B6 100%);">
        <div style="display:flex;flex-direction:column;align-items:center;gap:18px;">
          <img id="app-loading-mark" src="/assets/marca/splash-etiqueta.webp" width="88" height="118" alt="" aria-hidden="true" draggable="false" style="display:block;width:88px;height:auto;margin-bottom:4px;transform-origin:75% 4%;animation:appLoadingVaiven 2.4s ease-in-out infinite;filter:drop-shadow(0 5px 12px rgba(76,29,149,.28));" />
          <img id="app-loading-wala" src="/assets/marca/splash-wala.webp" width="122" height="53" alt="Walá" draggable="false" style="display:block;width:122px;height:auto;" />
          <div class="app-loading-pista" style="position:relative;width:132px;height:4px;border-radius:999px;overflow:hidden;background:rgba(255,255,255,.22);">
            <span id="app-loading-bar" style="position:absolute;top:0;bottom:0;left:0;width:40%;border-radius:inherit;background:#fff;animation:appLoadingVaYViene 1.4s ease-in-out infinite;"></span>
          </div>
        </div>
      </div>
      <style>
        /* Los mismos movimientos que PantallaCarga (Cargando.module.css: vaiven
           y vaYViene): solo transform, en CSS. */
        @keyframes appLoadingVaiven {
          0%, 100% { transform: rotate(-6deg); }
          50%      { transform: rotate(6deg); }
        }
        @keyframes appLoadingVaYViene {
          0% { transform: translateX(-100%); }
          100% { transform: translateX(250%); }
        }
        /* Las cargas siguientes (la marca ya se vio, ver el script de abajo):
           el mismo conjunto que la primera vez (etiqueta de 88 px que se mece,
           WALÁ de 122 px y la barra de 132 x 4), en el mismo lugar, pero a
           color sobre el fondo de la página. Las imágenes van de máscara con
           el degradado, como Cargando del kit (la W calada deja ver el fondo).
           Antes, una etiqueta de 34 px sola: en una conexión lenta parecía un
           error. React pinta después la cabecera y el esqueleto. */
        .app-loading-color { --tinta: linear-gradient(135deg, #8b5cf6 0%, #6d28d9 50%, #5b21b6 100%); --pista: rgba(124, 58, 237, .16); --corre: #7c3aed; }
        /* De noche, el mismo degradado del logo (no lila): es la misma marca. */
        [data-theme='dark'] .app-loading-color { --pista: rgba(167, 139, 250, .2); --corre: #8b5cf6; }
        .app-loading-color .app-loading-tag {
          display: block; width: 88px; aspect-ratio: 246 / 330; margin-bottom: 4px; background: var(--tinta);
          -webkit-mask: url('/assets/marca/splash-etiqueta.webp') center / contain no-repeat;
          mask: url('/assets/marca/splash-etiqueta.webp') center / contain no-repeat;
          transform-origin: 75% 4%;
          animation: appLoadingVaiven 2.4s ease-in-out infinite;
        }
        .app-loading-color .app-loading-wala {
          display: block; width: 122px; aspect-ratio: 368 / 160; background: var(--tinta);
          -webkit-mask: url('/assets/marca/splash-wala.webp') center / contain no-repeat;
          mask: url('/assets/marca/splash-wala.webp') center / contain no-repeat;
        }
        .app-loading-color .app-loading-pista { background: var(--pista) !important; }
        .app-loading-color #app-loading-bar { background: var(--corre) !important; }
        @media (prefers-reduced-motion: reduce) {
          #app-loading-mark, #app-loading-bar, .app-loading-tag { animation: none !important; }
          #app-loading-bar { width: 45%; opacity: .8; }
        }
      </style>
      <script>
        /* Si la pantalla de marca ya se vio alguna vez (wala_brand_seen, lo pone
           BrandLoaderOverlay), en las recargas siguientes no se repite el
           morado: el fondo de la página (claro u oscuro, data-theme ya está
           puesto) con el mismo conjunto a color. Corre inline, antes de
           cualquier bundle. En la app de Android no: cada arranque sale del
           splash nativo (la etiqueta sobre violeta) y sigue en esta pantalla
           de marca, como una app. */
        (function () {
          try {
            var app = Boolean(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
            if (!app && localStorage.getItem('wala_brand_seen') === '1') {
              var el = document.getElementById('app-loading');
              if (el) {
                var oscuro = document.documentElement.getAttribute('data-theme') === 'dark';
                el.style.background = oscuro ? '#14121C' : '#F8FAFC';
                el.classList.add('app-loading-color');
                var marca = document.getElementById('app-loading-mark');
                var wala = document.getElementById('app-loading-wala');
                if (marca) marca.outerHTML = '<span class="app-loading-tag" aria-hidden="true"></span>';
                if (wala) wala.outerHTML = '<span class="app-loading-wala" role="img" aria-label="Walá"></span>';
              }
            }
          } catch (e) { /* localStorage no disponible: se deja la pantalla de marca */ }
        })();
      </script>
    </div>
    <script type="module" src="/src/index.jsx"></script>
  </body>
</html>
