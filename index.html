<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#8A2BE2" />

    <!-- Modo Noche · Anti-FOUC ──────────────────────────────────────────────
         Fija data-theme en <html> ANTES de cargar React/CSS para que la página
         pinte directamente en el tema correcto (sin parpadeo claro->oscuro).
         Lee la elección guardada (localStorage "wala-theme"); si es "system" o
         no existe, usa prefers-color-scheme. DEBE coincidir con ThemeContext. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('wala-theme'); // "light" | "dark" | "system" | null
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = (saved === 'light' || saved === 'dark')
            ? saved
            : (prefersDark ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
    <meta name="description" content="Walá - Tienda de prendas personalizadas. Personaliza y compra tus prendas favoritas." />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" href="/logo-wala.png" />
    <link rel="apple-touch-icon" href="/logo-wala.png" />

    <!-- Preconnect crítico: fuentes UI y Firebase -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://firebasestorage.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://res.cloudinary.com" crossorigin />

    <!-- DNS prefetch adicional -->
    <link rel="dns-prefetch" href="https://i.ibb.co" />
    <link rel="dns-prefetch" href="https://drive.google.com" />
    <link rel="dns-prefetch" href="https://identitytoolkit.googleapis.com" />

    <!-- Tipografías locales (editor): carga diferida para no bloquear UI -->
    <link href="/fonts/fonts.css" rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript><link href="/fonts/fonts.css" rel="stylesheet" /></noscript>

    <!-- Poppins (UI principal) — carga prioritaria, solo los pesos necesarios -->
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Fuentes del editor — carga DIFERIDA (no bloquean el render inicial) -->
    <link
      id="editor-fonts-1"
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Lato:ital,wght@0,400;0,700;1,400;1,700&family=Merriweather:ital,wght@0,400;0,700;1,400;1,700&family=Montserrat:ital,wght@0,400;0,600;0,700;1,400;1,700&family=Open+Sans:ital,wght@0,400;0,600;0,700;1,400;1,700&family=Oswald:wght@400;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,700&family=Roboto:ital,wght@0,400;0,700;1,400;1,700&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400;1,700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <link
      id="editor-fonts-2"
      href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:ital,wght@0,400;0,600;0,700;1,400;1,700&family=DM+Sans:ital,wght@0,400;0,700;1,400;1,700&family=Dancing+Script:wght@400;700&family=Fira+Sans:ital,wght@0,400;0,700;1,400;1,700&family=Great+Vibes&family=Inter:ital,wght@0,400;0,700;1,400;1,700&family=Kanit:ital,wght@0,400;0,700;1,400;1,700&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Lobster&family=Nunito:ital,wght@0,400;0,700;1,400;1,700&family=Noto+Sans:ital,wght@0,400;0,700;1,400;1,700&family=Pacifico&family=Permanent+Marker&family=PT+Sans:ital,wght@0,400;0,700;1,400;1,700&family=Quicksand:wght@400;600;700&family=Raleway:ital,wght@0,400;0,700;1,400;1,700&family=Righteous&family=Rubik:ital,wght@0,400;0,700;1,400;1,700&family=Ubuntu:ital,wght@0,400;0,700;1,400;1,700&family=Work+Sans:ital,wght@0,400;0,600;0,700;1,400;1,700&family=Caveat:wght@400;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet" />
    </noscript>

    <title>Walá - Tienda Personalizada</title>
  </head>
  <body>
    <noscript>Necesitas habilitar JavaScript para ejecutar esta aplicación.</noscript>
    <div id="root">
      <!-- Pantalla de carga mientras React carga — mismo diseño que BrandLoader.jsx
           (isotipo del logo en blanco/violeta + el mismo degradado de marca), asi
           que cuando React monta y toma el relevo con su propio BrandLoader, la
           transicion es invisible en vez de un salto de "fondo plano" a "con logo".
           Inline (sin CSS module: esto pinta ANTES de que cargue ningun bundle). -->
      <div id="app-loading" style="position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#8B5CF6 0%,#5B21B6 100%);">
        <svg viewBox="12 0 94 109" width="64" style="animation:appLoadingPulse 1.8s cubic-bezier(0.16,1,0.3,1) infinite;filter:drop-shadow(0 8px 24px rgba(76,29,149,.35));" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M 32 42 L 28 88 C 27 92 30 94 34 93 L 85 80 C 89 79 91 76 89 72 L 76 18 C 75 13 68 11 65 14 L 36 34 C 32 37 31 40 32 42 Z" fill="#FFFFFF" />
          <circle cx="67" cy="23" r="6.5" fill="#4C1D95" />
          <path d="M 38 42 L 43 78 L 54 52 L 64 72 L 72 38" fill="none" stroke="#4C1D95" stroke-width="15" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </div>
      <style>
        @keyframes appLoadingPulse {
          0%, 100% { transform: scale(0.94); opacity: 0.85; }
          50% { transform: scale(1.05); opacity: 1; }
        }
        @media (prefers-reduced-motion: reduce) {
          #app-loading svg { animation: none !important; opacity: 1 !important; }
        }
      </style>
    </div>
    <script type="module" src="/src/index.jsx"></script>
  </body>
</html>
